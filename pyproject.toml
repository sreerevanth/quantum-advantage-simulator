[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-advantage-simulator"
version = "0.1.0"
description = "Evidence-gated small-system quantum research benchmarks"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=1.26", "scipy>=1.12", "PyYAML>=6", "matplotlib>=3.8"]

[project.optional-dependencies]
ml = ["torch>=2.2"]
quantum = ["pennylane>=0.40", "qutip>=5"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
hardware = ["qiskit>=2", "qiskit-ibm-runtime>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.14", "build>=1", "httpx>=0.27", "types-PyYAML"]
all = ["quantum-advantage-simulator[ml,quantum,api,hardware,dev]"]

[project.scripts]
qas = "qas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qas = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"

