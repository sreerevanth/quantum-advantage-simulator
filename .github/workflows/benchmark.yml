name: manual-phase1
on: workflow_dispatch
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[ml,quantum]'
      - run: qas benchmark --config experiments/configs/tfim_phase1.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-evidence
          path: results/
