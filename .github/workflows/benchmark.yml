name: manual-research-suite
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [quick, full]
        default: quick
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[ml,quantum]'
      - run: qas suite --${{ inputs.mode }} --device cpu --output results/research
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-evidence
          path: results/research/
