name: scientific-validation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev,ml,quantum,api]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/qas
      - run: pytest --cov=qas --cov-report=term-missing
      - run: qas --help
      - run: python -m build
